<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="description" content="BATPAPO — Seu papo. Sua toca. Sua galera. Plataforma de comunicação social." />
  <meta name="theme-color" content="#0a0a0b" />
  <title>BATPAPO — Seu papo. Sua toca. Sua galera.</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/animations.css" />
</head>
<body>
  <div class="boot-screen" id="boot-screen">
    <div class="boot-logo">
      <h1 class="boot-title">BATPAPO</h1>
      <p class="boot-slogan">Seu papo. Sua toca. Sua galera.</p>
    </div>
    <div class="boot-loader"><div class="boot-bar"></div></div>
    <p id="boot-hint" style="margin-top:24px;color:#6B6780;font-size:0.85rem;font-family:Outfit,sans-serif;opacity:0;transition:opacity 0.5s;text-align:center;max-width:320px;padding:0 16px">
      Carregando…
    </p>
  </div>

  <div id="app"></div>
  <div id="toast-container" class="toast-container" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script>
    setTimeout(function () {
      var el = document.getElementById('boot-screen');
      var hint = document.getElementById('boot-hint');
      if (el && !el.classList.contains('hide') && hint) hint.style.opacity = '1';
    }, 3000);
    setTimeout(function () {
      var el = document.getElementById('boot-screen');
      if (el && !el.classList.contains('hide')) {
        el.classList.add('hide');
        el.style.pointerEvents = 'none';
      }
    }, 7000);
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
